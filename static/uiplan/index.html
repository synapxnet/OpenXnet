<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenXnet</title>
  <link rel="stylesheet" href="../fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/uiplan-tokens.css">
  <link rel="stylesheet" href="./styles.css?v=20260505-ui-rewrite-19">
</head>
<body>
  <div id="app" class="ox-app" v-cloak>
    <header class="ox-topbar">
      <button class="ox-topbar__toggle ox-tooltip" data-tooltip="侧栏" @click="sidebarCollapsed = !sidebarCollapsed">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="ox-topbar__brand" @click="navigate('chat')">
        <div class="ox-topbar__brand-icon">OX</div>
        <span>OpenXnet</span>
      </div>
      <div class="ox-topbar__search">
        <div class="ox-search">
          <i class="fa-solid fa-magnifying-glass ox-search__icon"></i>
          <input class="ox-input ox-input--pill" v-model="globalSearch" placeholder="搜索对话、技能、模型...">
          <span class="ox-search__shortcut">Ctrl K</span>
        </div>
      </div>
      <div class="ox-topbar__actions">
        <button class="ox-topbar__action-btn ox-tooltip" data-tooltip="通知">
          <i class="fa-solid fa-bell"></i>
          <span class="ox-notification-dot"></span>
        </button>
        <button class="ox-topbar__action-btn ox-tooltip" data-tooltip="刷新数据" @click="refreshAll">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button class="ox-topbar__action-btn ox-tooltip" data-tooltip="切换主题">
          <i class="fa-solid fa-sun"></i>
        </button>
        <div class="ox-topbar__account">
          <button class="ox-topbar__avatar ox-tooltip" :data-tooltip="accountTooltip" @click="!isAuthenticated && navigate('login')">{{ accountAvatarInitial }}</button>
          <div class="ox-account-menu">
            <div class="ox-account-menu__summary">
              <strong>{{ accountDisplayName }}</strong>
              <span>{{ isAuthenticated ? (authEntitlement?.active_plan_name || '未订阅') : '点击登录同步权益' }}</span>
            </div>
            <button v-for="item in accountMenuItems" :key="item.label" class="ox-account-menu__item" :class="{ 'ox-account-menu__item--danger': item.danger }" @click="handleAccountAction(item)">
              <i :class="item.icon"></i>{{ item.label }}
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="ox-body">
      <aside class="ox-sidebar" :class="{ 'ox-sidebar--collapsed': sidebarCollapsed }">
        <nav class="ox-sidebar__nav">
          <template v-for="section in navSections" :key="section.label">
            <span class="ox-sidebar__section-label">{{ section.label }}</span>
            <button
              v-for="item in section.items"
              :key="item.id"
              class="ox-nav-item ox-tooltip"
              :class="{ 'ox-nav-item--active': currentRoute === item.id }"
              :data-tooltip="sidebarCollapsed ? item.label : ''"
              @click="navigate(item.id)"
            >
              <span class="ox-nav-item__icon"><i :class="item.icon"></i></span>
              <span class="ox-nav-item__label">{{ item.label }}</span>
            </button>
            <div class="ox-sidebar__divider"></div>
          </template>
        </nav>
        <div class="ox-sidebar__footer">
          <button class="ox-nav-item ox-tooltip" :class="{ 'ox-nav-item--active': currentRoute === 'about' }" :data-tooltip="sidebarCollapsed ? '关于' : ''" @click="navigate('about')">
            <span class="ox-nav-item__icon"><i class="fa-solid fa-circle-info"></i></span>
            <span class="ox-nav-item__label">关于</span>
          </button>
        </div>
      </aside>

      <main class="ox-main ox-main--column">
        <template v-if="currentRoute === 'startup'">
          <div class="ox-content">
            <section class="startup-page">
              <div class="startup-page__mark">OX</div>
              <span class="uip-status-pill uip-status-pill--green">神经符号 OS 就绪</span>
              <h1>OpenXnet 启动页</h1>
              <p>正在准备 AI 内核、模型路由、工具桥接与桌面工作台。</p>
              <div class="startup-grid">
                <article v-for="module in startupModules" :key="module.label" class="startup-card">
                  <span class="uip-card__icon" :class="'uip-tone--' + module.tone"><i :class="module.icon"></i></span>
                  <strong>{{ module.label }}</strong>
                  <small>{{ module.desc }}</small>
                </article>
              </div>
              <div class="startup-actions">
                <button class="ox-btn ox-btn--primary" @click="navigate('home')"><i class="fa-solid fa-house"></i>首页</button>
                <button class="ox-btn ox-btn--secondary" @click="navigate('chat')"><i class="fa-solid fa-comments"></i>实时对话</button>
                <button class="ox-btn ox-btn--secondary" @click="navigate('shell')"><i class="fa-solid fa-layer-group"></i>返回导航</button>
              </div>
            </section>
          </div>
        </template>

        <template v-else-if="currentRoute === 'login'">
          <div class="ox-content">
            <section class="login-page">
              <div class="login-panel">
                <div class="login-panel__brand">OX</div>
                <h1>登录 OpenXnet</h1>
                <div class="ox-tabs ox-tabs--pill login-tabs">
                  <button v-for="provider in loginProviders" :key="provider.id" class="ox-tab" :class="{ 'ox-tab--active': provider.id === loginMode }" @click="setLoginMode(provider.id)">
                    <i :class="provider.icon"></i>{{ provider.label }}
                  </button>
                </div>
                <label v-if="loginMode === 'password'" class="ox-input-group">
                  <span class="ox-input-label">账号</span>
                  <input class="ox-input" v-model.trim="loginIdentity" placeholder="手机号 / 邮箱 / 用户名" autocomplete="username" @keyup.enter="loginSubmit">
                </label>
                <template v-else>
                  <label class="ox-input-group">
                    <span class="ox-input-label">手机号</span>
                    <input class="ox-input" v-model.trim="loginPhone" placeholder="请输入手机号" autocomplete="tel" @keyup.enter="loginSubmit">
                  </label>
                  <div class="login-code-row">
                    <input class="ox-input" v-model.trim="loginCode" placeholder="验证码" @keyup.enter="loginSubmit">
                    <button class="ox-btn ox-btn--secondary" :disabled="loginSmsCooldown > 0" @click="sendLoginSms">
                      {{ loginSmsCooldown > 0 ? loginSmsCooldown + 's' : '发送验证码' }}
                    </button>
                  </div>
                </template>
                <label v-if="loginMode !== 'sms'" class="ox-input-group">
                  <span class="ox-input-label">密码</span>
                  <input class="ox-input" v-model="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password" @keyup.enter="loginSubmit">
                </label>
                <template v-if="loginMode === 'register'">
                  <label class="ox-input-group"><span class="ox-input-label">昵称</span><input class="ox-input" v-model.trim="loginNickname" placeholder="4-50 位昵称"></label>
                  <label class="ox-input-group"><span class="ox-input-label">邮箱</span><input class="ox-input" v-model.trim="loginEmail" placeholder="可选"></label>
                </template>
                <p v-if="authError" class="uip-inline-alert uip-inline-alert--error">{{ authError }}</p>
                <p v-else-if="authNotice" class="uip-inline-alert">{{ authNotice }}</p>
                <button class="ox-btn ox-btn--primary ox-btn--block" :disabled="authLoading" @click="loginSubmit">
                  {{ authLoading ? '处理中...' : (loginMode === 'register' ? '注册并登录' : '登 录') }}
                </button>
                <div class="login-panel__links">
                  <button @click="showForgotPasswordNotice">忘记密码?</button>
                  <button @click="setLoginMode(loginMode === 'register' ? 'password' : 'register')">{{ loginMode === 'register' ? '已有账号登录' : '立即注册' }}</button>
                </div>
              </div>
            </section>
          </div>
        </template>

        <template v-else-if="currentRoute === 'shell'">
          <div class="ox-content">
            <section class="shell-home">
              <div class="shell-home__status">
                <span class="uip-status-pill uip-status-pill--green">Runtime Ready</span>
                <span class="uip-status-pill">{{ currentModelLabel }}</span>
              </div>
              <h1>神经符号 OS 就绪</h1>
              <p>统一导航壳层已载入，可以进入首页、实时对话、开发者工作台或返回导航。</p>
              <div class="shell-action-grid">
                <button v-for="action in shellActions" :key="action.label" class="action-card" @click="navigate(action.route)">
                  <i :class="action.icon"></i>
                  <span>{{ action.label }}</span>
                  <small>打开 {{ action.label }} 工作区</small>
                </button>
              </div>
            </section>
          </div>
        </template>

        <template v-else-if="currentRoute === 'chat'">
          <div class="chat-header">
            <div class="chat-header__left">
              <div class="chat-header__title">{{ activeAgentName }}</div>
              <span class="chat-header__model">
                <i class="fa-solid fa-microchip"></i>
                {{ currentModelLabel }}
              </span>
              <span class="ox-status-dot" :class="wsConnected ? 'ox-status-dot--online' : 'ox-status-dot--warning'"></span>
            </div>
              <div class="chat-header__right">
              <button class="ox-btn--icon ox-tooltip" data-tooltip="导出对话" @click="exportConversation">
                <i class="fa-solid fa-file-export"></i>
              </button>
              <button class="ox-btn--icon ox-tooltip" data-tooltip="清空上下文" @click="clearConversationContext">
                <i class="fa-solid fa-eraser"></i>
              </button>
              <button class="ox-btn--icon ox-tooltip" data-tooltip="新对话" @click="newConversation">
                <i class="fa-solid fa-plus"></i>
              </button>
              <button class="ox-btn--icon ox-tooltip" data-tooltip="对话历史" @click="historyOpen = !historyOpen">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </button>
              <button class="ox-btn--icon ox-tooltip" data-tooltip="设置" @click="settingsOpen = !settingsOpen">
                <i class="fa-solid fa-sliders"></i>
              </button>
            </div>
          </div>

          <div class="chat-main">
            <aside class="chat-history" v-if="historyOpen">
              <div class="chat-history__header">
                <span>对话历史</span>
                <button class="ox-btn--icon" @click="historyOpen = false"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <button
                v-for="conv in filteredConversations"
                :key="conv.id"
                class="conversation-item"
                :class="{ 'conversation-item--active': conv.id === conversationId }"
                @click="loadConversation(conv.id)"
              >
                <span class="conversation-item__title">{{ conv.title || '未命名对话' }}</span>
                <span class="conversation-item__meta">{{ formatDate(conv.timestamp) }}</span>
              </button>
            </aside>

            <div class="chat-messages" ref="messagesScroller">
              <div class="chat-messages__inner">
                <div v-for="(message, index) in visibleMessages" :key="message.id || index" class="message" :class="messageClass(message, index)">
                  <div v-if="message.role !== 'user'" class="message__avatar">AI</div>
                  <div class="message__content">
                    <div class="message__bubble" v-html="formatMessage(message.content)"></div>
                    <div class="message__time">{{ message.time || formatTime(message.timestamp) }}</div>
                  </div>
                </div>

                <div v-if="isSending && !assistantHasContent" class="message message--ai message--typing">
                  <div class="message__avatar">AI</div>
                  <div class="message__content">
                    <div class="message__bubble">
                      <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="chat-input-wrapper">
              <div class="chat-input-card">
                <div class="chat-quick-tools">
                  <button v-for="tool in chatQuickTools" :key="tool.id" class="chat-quick-tool" @click="runQuickTool(tool)">
                    <i :class="tool.icon"></i>{{ tool.label }}
                  </button>
                </div>
                <textarea
                  ref="composer"
                  rows="1"
                  v-model="userInput"
                  placeholder="输入消息..."
                  @keydown.enter.exact.prevent="sendMessage"
                  @input="resizeComposer"
                ></textarea>
                <div class="chat-input-toolbar">
                  <div class="chat-input-toolbar__left">
                    <button class="toolbar-btn ox-tooltip" data-tooltip="上传文件"><i class="fa-solid fa-paperclip"></i></button>
                    <button class="toolbar-btn ox-tooltip" data-tooltip="代码块" @click="insertSnippet('```\\n\\n```')"><i class="fa-solid fa-code"></i></button>
                    <button class="toolbar-btn ox-tooltip" data-tooltip="上传图片"><i class="fa-solid fa-image"></i></button>
                    <button class="toolbar-btn ox-tooltip" data-tooltip="语音输入"><i class="fa-solid fa-microphone"></i></button>
                  </div>
                  <div class="chat-input-toolbar__right">
                    <span class="char-count">{{ userInput.length }}/4000</span>
                    <button v-if="isSending" class="send-btn send-btn--stop ox-tooltip" data-tooltip="停止" @click="stopGenerate">
                      <i class="fa-solid fa-square"></i>
                    </button>
                    <button v-else class="send-btn ox-tooltip" data-tooltip="发送" :disabled="!userInput.trim()" @click="sendMessage">
                      <i class="fa-solid fa-arrow-up"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <button class="settings-toggle" @click="settingsOpen = true">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <aside class="settings-panel" :class="{ open: settingsOpen }">
              <div class="settings-panel__header">
                <span class="settings-panel__title">对话设置</span>
                <button class="settings-panel__close" @click="settingsOpen = false"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="settings-panel__body">
                <div class="setting-group">
                  <label class="setting-group__label">模型选择</label>
                  <select v-model="mainAgent" @change="persistSettings">
                    <option v-for="model in modelOptions" :key="model.id" :value="model.id">{{ model.label }}</option>
                  </select>
                </div>
                <div class="setting-group">
                  <label class="setting-group__label">温度 (Temperature)</label>
                  <div class="slider-row">
                    <input type="range" min="0" max="2" step="0.1" v-model.number="temperature" @change="persistSettings">
                    <span class="slider-value">{{ temperature.toFixed(1) }}</span>
                  </div>
                  <span class="ox-small">较低值更精确，较高值更有创意</span>
                </div>
                <div class="setting-group">
                  <label class="setting-group__label">最大输出长度</label>
                  <select v-model.number="maxTokens" @change="persistSettings">
                    <option :value="1024">1024 tokens</option>
                    <option :value="2048">2048 tokens</option>
                    <option :value="4096">4096 tokens</option>
                    <option :value="8192">8192 tokens</option>
                  </select>
                </div>
                <div class="setting-group">
                  <label class="setting-row">
                    <span>联网搜索</span>
                    <span class="ox-toggle">
                      <input type="checkbox" v-model="webSearchEnabled" @change="persistSettings">
                      <span class="ox-toggle__track"></span>
                      <span class="ox-toggle__thumb"></span>
                    </span>
                  </label>
                  <label class="setting-row">
                    <span>深度研究</span>
                    <span class="ox-toggle">
                      <input type="checkbox" v-model="deepResearchEnabled" @change="persistSettings">
                      <span class="ox-toggle__track"></span>
                      <span class="ox-toggle__thumb"></span>
                    </span>
                  </label>
                  <label class="setting-row">
                    <span>推理模式</span>
                    <span class="ox-toggle">
                      <input type="checkbox" v-model="thinkingEnabled" @change="persistSettings">
                      <span class="ox-toggle__track"></span>
                      <span class="ox-toggle__thumb"></span>
                    </span>
                  </label>
                </div>
              </div>
            </aside>
          </div>
        </template>

        <template v-else-if="currentRoute === 'model-config'">
          <div class="ox-content">
            <div class="ox-page-header">
              <div>
                <h1 class="ox-page-header__title">模型配置</h1>
                <p class="ox-page-header__subtitle">管理 AI 模型提供商和 API 密钥</p>
              </div>
              <div class="ox-page-header__actions">
                <button class="ox-btn ox-btn--secondary" @click="fetchModels(); importProviderModels()"><i class="fa-solid fa-rotate-right"></i>刷新模型</button>
                <button class="ox-btn ox-btn--secondary" :disabled="!!providerActionLoading" @click="importProviderModels"><i class="fa-solid fa-download"></i>导入模型</button>
                <button class="ox-btn ox-btn--primary" @click="addProviderDraft"><i class="fa-solid fa-plus"></i>添加提供商</button>
              </div>
            </div>

            <div class="mc-tabs-wrap">
              <div class="ox-tabs ox-tabs--pill">
                <button v-for="tab in modelTabs" :key="tab.id" class="ox-tab" :class="{ 'ox-tab--active': modelTab === tab.id }" @click="modelTab = tab.id">{{ tab.label }}</button>
              </div>
            </div>

            <div v-if="modelTab === 'service'" class="mc-tab-panel mc-tab-panel--active">
              <div class="mc-providers-grid ox-stagger">
                <button
                  v-for="provider in providerCards"
                  :key="provider.id"
                  class="mc-provider-card"
                  :class="{ 'mc-provider-card--active': provider.id === selectedProviderId }"
                  @click="selectedProviderId = provider.id"
                >
                  <div class="mc-provider-card__header">
                    <div class="mc-provider-card__icon" :style="{ background: provider.color }">{{ provider.initial }}</div>
                    <div class="mc-provider-card__info">
                      <div class="mc-provider-card__name">{{ provider.name }}</div>
                      <div class="mc-provider-card__status">
                        <span class="ox-status-dot" :class="provider.connected ? 'ox-status-dot--online' : 'ox-status-dot--offline'"></span>
                        {{ provider.connected ? '已连接' : '未配置' }}
                      </div>
                    </div>
                  </div>
                  <div class="mc-provider-card__models"><i class="fa-solid fa-cube"></i>{{ provider.models.length || 4 }} 个模型已配置</div>
                </button>
              </div>

              <section class="mc-expanded-section">
                <div class="mc-expanded-header">
                  <div class="mc-expanded-header__title">
                    <div class="mc-expanded-header__title-icon" :style="{ background: selectedProvider.color }">{{ selectedProvider.initial }}</div>
                    {{ selectedProvider.name }} 模型列表
                  </div>
                <div class="mc-api-key-row">
                  <span class="ox-small">API Key</span>
                  <div class="mc-api-key-field">
                    <input :type="showApiKey ? 'text' : 'password'" class="ox-input" v-model="selectedProvider.apiKey" @change="persistProvider">
                    <button class="mc-api-key-field__toggle" @click="showApiKey = !showApiKey"><i :class="showApiKey ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i></button>
                  </div>
                  <span class="ox-small">Base URL</span>
                  <input class="ox-input mc-base-url-input" v-model="selectedProvider.url" placeholder="https://api.openai.com/v1" @change="persistProvider">
                  <button class="ox-btn ox-btn--secondary ox-btn--sm" @click="copyText(selectedProvider.apiKey, 'API Key')"><i class="fa-solid fa-copy"></i>复制</button>
                  <button class="ox-btn ox-btn--secondary ox-btn--sm" :disabled="!!providerActionLoading" @click="validateProvider"><i class="fa-solid fa-check-circle"></i>{{ providerActionLoading.startsWith('validate:') ? '验证中' : '验证' }}</button>
                  <button class="ox-btn ox-btn--primary ox-btn--sm" :disabled="!!providerActionLoading" @click="applyProviderProfile"><i class="fa-solid fa-floppy-disk"></i>应用</button>
                </div>
                </div>
                <p class="uip-inline-alert mc-provider-alert" :class="providerActionClass">{{ providerActionText }}</p>
                <div class="mc-model-table-wrap">
                  <table class="mc-model-table">
                    <thead>
                      <tr><th>模型名称</th><th>能力</th><th>上下文长度</th><th>状态</th></tr>
                    </thead>
                    <tbody>
                      <tr v-for="model in selectedProvider.models" :key="model.name">
                        <td><span class="mc-model-name">{{ model.name }}</span></td>
                        <td>
                          <div class="mc-tags">
                            <span v-for="cap in model.caps" :key="cap" class="mc-tag" :class="'mc-tag--' + capClass(cap)">{{ cap }}</span>
                          </div>
                        </td>
                        <td><span class="mc-model-context">{{ model.context }}</span></td>
                        <td>
                          <label class="ox-toggle">
                            <input type="checkbox" v-model="model.enabled" @change="persistProvider">
                            <span class="ox-toggle__track"></span>
                            <span class="ox-toggle__thumb"></span>
                          </label>
                          <button class="uip-icon-btn" @click="testProviderModel(model)"><i class="fa-solid fa-play"></i></button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>

            <div v-else class="mc-tab-panel mc-tab-panel--active">
              <div class="mc-section-header">
                <div class="mc-section-header__title"><i :class="activeModelTab.icon"></i>{{ activeModelTab.label }}</div>
                <div class="mc-section-header__desc">{{ activeModelTab.desc }}</div>
              </div>
              <div class="mc-current-model">
                <div class="mc-current-model__info">
                  <div class="mc-current-model__icon"><i :class="activeModelTab.icon"></i></div>
                  <div>
                    <div class="mc-current-model__name">{{ modelSettingName(modelTab) }}</div>
                    <div class="mc-current-model__provider">{{ selectedProvider.name }} / {{ selectedProvider.models[0]?.context || '128K' }} context</div>
                  </div>
                </div>
                <div class="mc-current-model__badge"><i class="fa-solid fa-check-circle"></i>已选择</div>
              </div>
              <div class="mc-model-select-label">可用模型</div>
              <div class="mc-model-select-list">
                <button
                  v-for="model in modelOptions"
                  :key="model.id + modelTab"
                  class="mc-model-option"
                  :class="{ 'mc-model-option--selected': model.id === modelSettingName(modelTab) }"
                  @click="setModelForTab(modelTab, model.id)"
                >
                  <div class="mc-model-option__radio"></div>
                  <div class="mc-model-option__body">
                    <div class="mc-model-option__top">
                      <span class="mc-model-option__name">{{ model.label }}</span>
                      <span class="mc-model-option__provider-tag">{{ model.provider }}</span>
                      <span class="mc-model-option__context">{{ model.context }}</span>
                    </div>
                    <div class="mc-model-option__desc">{{ model.desc }}</div>
                  </div>
                </button>
              </div>
              <section class="mc-config-section">
                <div class="mc-config-section__title"><i class="fa-solid fa-sliders"></i>模型参数</div>
                <div class="mc-config-grid">
                  <label class="mc-config-item">
                    <span class="mc-config-label">Temperature <span class="mc-config-label__value">{{ temperature.toFixed(1) }}</span></span>
                    <input class="mc-range" type="range" min="0" max="2" step="0.1" v-model.number="temperature" @change="persistSettings">
                  </label>
                  <label class="mc-config-item">
                    <span class="mc-config-label">Max Tokens <span class="mc-config-label__value">{{ maxTokens }}</span></span>
                    <input class="mc-config-input" type="number" v-model.number="maxTokens" @change="persistSettings">
                  </label>
                  <label class="mc-config-item">

                  <table class="uip-table">
                    <thead><tr><th>项目</th><th>金额</th><th>状态</th><th>日期</th></tr></thead>
                    <tbody><tr v-for="row in billingRows" :key="row.item"><td>{{ row.item }}</td><td>{{ row.amount }}</td><td><span class="uip-status-pill">{{ row.status }}</span></td><td>{{ row.date }}</td></tr></tbody>
                  </table>
                </div>
              </section>
            </div>
            <section class="uip-panel">
              <div class="uip-panel__header">
                <h2>套餐对比</h2>
                <button class="uip-link-btn" @click="markAction('联系我们')">联系我们<i class="fa-solid fa-arrow-right"></i></button>
              </div>
              <div class="uip-table-wrap">
                <table class="uip-table subscription-compare">
                  <thead><tr><th>权益</th><th>免费版</th><th>专业版</th><th>企业版</th></tr></thead>
                  <tbody>
                    <tr v-for="row in subscriptionComparisonRows" :key="row.item">
                      <td><strong>{{ row.item }}</strong></td>
                      <td>{{ row.free }}</td>
                      <td>{{ row.pro }}</td>
                      <td>{{ row.enterprise }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </template>

        <template v-else-if="currentRoute === 'about'">
          <div class="ox-content">
            <section class="about-page">
              <div class="about-logo">OX</div>
              <h1>OpenXnet</h1>
              <p>面向 AI 多代理工作流的桌面操作系统式工作台。</p>
              <div class="about-grid">
                <span v-for="row in aboutInfoRows" :key="row[0]"><strong>{{ row[0] }}</strong><small>{{ row[1] }}</small></span>
              </div>
              <div class="about-feature-grid">
                <button v-for="feature in aboutFeatureRows" :key="feature.label" class="about-feature-card" @click="runApiAction(feature.label)">
                  <i :class="feature.icon"></i>
                  <strong>{{ feature.label }}</strong>
                  <small>{{ feature.desc }}</small>
                </button>
              </div>
              <div class="about-actions">
                <button v-for="action in aboutActions" :key="action.label" class="ox-btn" :class="action.label === '检查更新' ? 'ox-btn--primary' : 'ox-btn--secondary'" @click="action.label === '检查更新' ? checkUpdates() : action.label === '打开官网' ? openExternalUrl('https://openxnet.synapxnet.com') : action.label === '查看许可' ? openExternalUrl('https://www.gnu.org/licenses/agpl-3.0.html') : runApiAction(action.label)">
                  <i :class="action.icon"></i>{{ action.label }}
                </button>
              </div>
              <div class="about-build-strip">
                <span><i class="fa-solid fa-code-branch"></i>UIPlan SPA</span>
                <span><i class="fa-solid fa-shield-halved"></i>Local First</span>
                <span><i class="fa-solid fa-clock"></i>{{ clock }}</span>
              </div>
            </section>
          </div>
        </template>

        <template v-else>
          <div class="ox-content">
            <section class="shell-placeholder">
              <div class="shell-placeholder__icon"><i :class="placeholderPage.icon"></i></div>
              <div class="shell-kernel-status">
                <span class="shell-kernel-status__title">内核状态</span>
                <span class="shell-kernel-status__item"><span class="shell-kernel-status__dot"></span>Runtime Ready</span>
                <span class="shell-kernel-status__item"><span class="shell-kernel-status__dot shell-kernel-status__dot--blue"></span>{{ currentModelLabel }}</span>
              </div>
              <h1 class="shell-placeholder__title">{{ placeholderPage.title }}</h1>
              <p class="shell-placeholder__desc">{{ placeholderPage.desc }}</p>
              <div class="shell-placeholder__features">
                <span v-for="feature in placeholderPage.features" :key="feature" class="shell-placeholder__feature"><i class="fa-solid fa-check"></i>{{ feature }}</span>
              </div>
            </section>
          </div>
        </template>
      </main>
    </div>

    <footer class="ox-statusbar">
      <div class="ox-statusbar__left">
        <span class="ox-statusbar__item"><span class="ox-statusbar__dot" :class="{ 'ox-statusbar__dot--offline': !wsConnected }"></span>{{ wsConnected ? '后端已连接' : '连接中' }}</span>
        <span class="ox-statusbar__item"><i class="fa-solid fa-code-branch"></i>UIPlan SPA</span>
      </div>
      <div class="ox-statusbar__right">
        <span class="ox-statusbar__item"><i class="fa-solid fa-bolt"></i>{{ lastAction }}</span>
        <span class="ox-statusbar__item"><i class="fa-solid fa-microchip"></i>{{ currentModelLabel }}</span>
        <span class="ox-statusbar__item"><i class="fa-solid fa-clock"></i>{{ clock }}</span>
      </div>
    </footer>
  </div>

  <script src="../libs/vue.global.prod.js"></script>
  <script src="./app.js?v=20260505-ui-rewrite-19"></script>
</body>
</html>
